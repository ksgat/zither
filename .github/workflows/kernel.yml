name: Haskell
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: haskell
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
      - uses: actions/cache@v4
        with:
          path: ${{ steps.haskell.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-9.6.7-${{ hashFiles('kernel/*.cabal', 'kernel/cabal.project') }}
      - run: cabal build all && cabal test all
        working-directory: kernel
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: echo "ZITHER_KERNEL_PATH=$(cd kernel && cabal list-bin exe:zither-kernel)" >> "$GITHUB_ENV"
      - run: npm test
        env:
          zither_kernel_datadir: ${{ github.workspace }}/kernel
